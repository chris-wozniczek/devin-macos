name: Battleship
options:
  bundleIdPrefix: com.chriswozniczek
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Battleship:
    type: application
    platform: iOS
    sources:
      - path: Sources
    entitlements:
      path: Battleship.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Battleship
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Battleship uses the local network to find nearby players for a match.
        NSBonjourServices:
          - _bship-ww2._tcp
          - _bship-ww2._udp
        UIRequiredDeviceCapabilities: [gamekit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chriswozniczek.battleship
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
